[alias]
# Project tasks (crates/xtask): `cargo xtask check-version | check-branch | release-notes` build
# without the engine (seconds); `cargo xtask-dist` packages the toolkit (AppImage + Flatpak) and the
# starter asset library file (`cargo run -p xtask --features dist -- starter-pack [DIR]` writes only that).
xtask = "run --quiet --package xtask --"
xtask-dist = "run --quiet --package xtask --features dist -- dist"
# The web game runner: `cargo build --release --target wasm32-unknown-unknown -p rustpg2d-game`, then this.
xtask-web = "run --quiet --release --package xtask --features web -- web"

# The web game: macroquad's JS loader (mq_js_bundle.js) provides the functions miniquad /
# quad-snd declare in `extern` blocks; current Rust no longer leaves undefined symbols to the
# loader by default for this target.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=--allow-undefined"]
