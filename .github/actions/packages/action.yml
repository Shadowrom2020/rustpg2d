name: Build R(ust)PG2D packages
description: Release builds for Linux, the web (wasm32) and Windows (cross-compiled with MinGW-w64), plus the macOS build from the macos-build job's artifact; the AppImage, Flatpak and Windows zip of the R(ust)PG2D toolkit and the unsigned macOS app (cargo xtask-dist, artifact rustpg2d-macos-app-unsigned for the macos-app job); a smoke test of the Linux binaries under Xvfb and of the downloads' contents.
runs:
  using: composite
  steps:
    - name: Packaging tools
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends flatpak xvfb xauth libgl1-mesa-dri libglx-mesa0 libxi6 libxcursor1 libxkbcommon-x11-0 gcc-mingw-w64-x86-64
        rustup target add x86_64-pc-windows-gnu
    - name: Release build
      shell: bash
      run: cargo build --release --locked -p rustpg2d-editor -p rustpg2d-game
    - name: Web game (exports for browsers)
      shell: bash
      run: |
        rustup target add wasm32-unknown-unknown
        cargo build --release --locked --target wasm32-unknown-unknown -p rustpg2d-game
    - name: Windows build (the Windows zip; exports of Windows games)
      shell: bash
      run: cargo build --release --locked --target x86_64-pc-windows-gnu -p rustpg2d-editor -p rustpg2d-game
    - name: macOS build (the macOS app; exports of macOS games; built by the macos-build job)
      uses: actions/download-artifact@v8
      with:
        name: rustpg2d-macos-build
        path: target/macos
    - name: AppImage, Flatpak, Windows zip, macOS app
      shell: bash
      run: cargo xtask-dist --out dist --require-web --require-windows --require-macos --macos-dir target/macos
    - name: The unsigned macOS app for the macos-app job
      uses: actions/upload-artifact@v7
      with:
        name: rustpg2d-macos-app-unsigned
        path: dist/macos/macos-app.tar
        retention-days: 7
    - name: Smoke test (game and editor from the AppImage; contents of the downloads)
      shell: bash
      run: |
        cd "$RUNNER_TEMP"
        "$GITHUB_WORKSPACE"/dist/rustpg2d-*-x86_64.AppImage --appimage-extract > /dev/null
        export RUSTPG2D_MUTE=1 RUSTPG2D_SETTINGS_DIR="$RUNNER_TEMP/settings" XDG_DATA_HOME="$RUNNER_TEMP/data"
        export RUSTPG2D_EDITOR_CONFIG="$RUNNER_TEMP/editor-config" RUSTPG2D_LIBRARY="$RUNNER_TEMP/library"
        RUSTPG2D_AUTOPLAY="wait 2; status; quit" timeout 120 xvfb-run -a -s "-screen 0 1280x720x24" \
          squashfs-root/usr/bin/rustpg2d-game squashfs-root/usr/share/rustpg2d/example_project 2>&1 | tee game.log
        grep -q "menu=title" game.log
        test "$(head -c 4 squashfs-root/usr/lib/rustpg2d/rustpg2d-game.wasm | od -An -c | tr -d ' ')" = '\0asm'
        test "$(head -c 2 squashfs-root/usr/lib/rustpg2d/rustpg2d-game.exe)" = "MZ"
        test "$(head -c 4 squashfs-root/usr/lib/rustpg2d/rustpg2d-game-macos | od -An -tx1 | tr -d ' ')" = "cafebabe"
        test "$(unzip -l "$GITHUB_WORKSPACE"/dist/rustpg2d-*-windows-x86_64.zip | grep -cE '/(rustpg2d-editor\.exe|rustpg2d-game\.exe|rustpg2d-game-linux|rustpg2d-game-macos|rustpg2d-game\.wasm|example_project/project\.ron)$')" -eq 6
        test "$(tar -tf "$GITHUB_WORKSPACE/dist/macos/macos-app.tar" | grep -cE 'Contents/(MacOS/rustpg2d-editor|MacOS/rustpg2d-game|Info\.plist|Resources/rustpg2d-game-linux|Resources/rustpg2d-game\.exe|Resources/example_project/project\.ron)$')" -eq 6
        RUSTPG2D_EDITOR_SCRIPT="wait 2; status; quit" timeout 120 xvfb-run -a -s "-screen 0 1280x720x24" \
          squashfs-root/AppRun 2>&1 | tee editor.log
        grep -q "open=false" editor.log
        # The AI agent server (MCP over Streamable HTTP) answers initialize and lists its tools.
        RUSTPG2D_EDITOR_SCRIPT="mcp on 7743; wait 90; quit" timeout 150 xvfb-run -a -s "-screen 0 1280x720x24" \
          squashfs-root/AppRun squashfs-root/usr/share/rustpg2d/example_project > mcp-editor.log 2>&1 &
        for i in $(seq 1 60); do
          curl -s -m 2 -D mcp-headers.txt -o mcp-init.txt http://127.0.0.1:7743/mcp -X POST -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' && break
          sleep 1
        done
        grep -q '"serverInfo":{"name":"rustpg2d-editor"' mcp-init.txt
        sid=$(grep -i '^mcp-session-id:' mcp-headers.txt | tr -d '\r' | cut -d' ' -f2)
        curl -s -m 5 http://127.0.0.1:7743/mcp -X POST -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
          -H "Mcp-Session-Id: $sid" -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' > /dev/null
        curl -s -m 5 http://127.0.0.1:7743/mcp -X POST -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
          -H "Mcp-Session-Id: $sid" -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' > mcp-tools.txt
        grep -q '"name":"get_map"' mcp-tools.txt
        kill %1 2>/dev/null || true
