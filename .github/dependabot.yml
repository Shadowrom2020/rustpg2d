# Monthly dependency updates as pull requests into master (allowed by the branch policy as
# dependabot/*). Minor and patch updates come grouped in one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # Pinned stack (CLAUDE.md): macroquad / egui-macroquad move together, by hand. egui and
      # egui-phosphor follow egui-macroquad: every egui-phosphor after 0.9 needs a newer egui
      # than egui-macroquad 0.17.3 (egui 0.31) provides.
      - dependency-name: macroquad
      - dependency-name: egui-macroquad
      - dependency-name: egui
      - dependency-name: egui-phosphor
      # Shared with macroquad: `image` only turns on the JPEG decoder of macroquad's image 0.24,
      # `lewton` is the Ogg decoder macroquad uses. A newer version would be a second, unused
      # (image: JPEG textures stop loading) or duplicate crate; they move with macroquad.
      - dependency-name: image
      - dependency-name: lewton
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
