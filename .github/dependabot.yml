# Monthly dependency updates as pull requests into master (allowed by the branch policy as
# dependabot/*). Minor and patch updates come grouped in one pull request per ecosystem; egui's
# crates come in a pull request of their own.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # The editor's UI (crates/studio): egui and the crates built on it are released together
      # (egui_dock, egui_kittest follow each egui release), so they move as one, also across a
      # 0.x minor version, which is a breaking one. (First: a dependency joins the first group
      # that matches it.)
      egui:
        patterns: ["egui", "egui*", "eframe", "epaint*", "emath", "ecolor"]
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # The engine draws with the editor's wgpu device (gfx::init takes eframe's device and
      # queue), so wgpu must stay the version egui-wgpu uses: it moves with an egui update, by
      # hand. The same for winit (the studio asks eframe's event loop for an X11 window, gfx's
      # window is winit too) and glow (gfx reads textures back through wgpu's WebGL context).
      - dependency-name: wgpu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: winit
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: glow
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
