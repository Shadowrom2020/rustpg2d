# Checks for every pull request into develop / master, and pushes to master (their results on
# the merge commit satisfy the back-merge pull request into develop). The job names are the
# required status checks of the branch rulesets (AGENTS.md):
#   develop: Branch policy, Build, lint, test
#   master:  Branch policy, Build, lint, test, Version, Packages
# Version, Windows, macOS, the release builds (builds.yml: every platform at once), Packages
# (assembles them) and the macOS app (macos-app.yml) only run for pull requests into master
# (release / hotfix branches) and when started by hand (Actions > CI > Run workflow, any branch:
# all of them, to try platform or packaging changes before a release). The Release workflow
# publishes the packages of the merged pull request's run instead of building them again.
# Runtime smoke (scripts/ci/smoke.sh: the game and the editor running under Xvfb) runs for every
# pull request; it is advisory until it has proven itself stable.
# A push to master whose tree is the merged pull request's (always: master must be up to date
# before a merge) only reports the checks; the pull request ran them on that very tree. So does
# the back-merge pull request master -> develop when develop has nothing master lacks.
name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  policy:
    name: Branch policy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      # xtask without the dist feature has no engine dependency: compiles in seconds.
      - name: Branch may merge into its target
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: cargo xtask check-branch "$HEAD_REF" "$BASE_REF"
      - name: Pushes need no check
        if: github.event_name != 'pull_request'
        run: echo "push to ${{ github.ref_name }}"

  build:
    name: Build, lint, test
    runs-on: ubuntu-22.04
    env:
      # Local debug builds optimize dependencies (Cargo.toml) to keep the game playable; CI only
      # compiles and runs short tests, so unoptimized is much faster.
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Nothing new to test: a merge into master with the pull request's tree (master only takes
      # up-to-date branches), or the back-merge master -> develop while develop has nothing master
      # lacks (the merge is master's tree, which its release / hotfix pull request tested).
      - name: Already tested?
        id: tested
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          same_tree() { git rev-parse -q --verify HEAD^2 > /dev/null && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; }
          if [ "$EVENT" = push ] && same_tree; then
            echo "the merged pull request tested this tree"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = pull_request ] && [ "$HEAD_REF" = master ] && [ "$BASE_REF" = develop ] && same_tree; then
            echo "back-merge: the result is master's tree, tested by its release / hotfix pull request"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tested.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - if: steps.tested.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - if: steps.tested.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev libudev-dev
      # No separate `cargo build`: clippy checks every target (all features, so xtask's dist
      # too) and `cargo test` compiles every crate, binaries included.
      - if: steps.tested.outputs.skip != 'true'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - if: steps.tested.outputs.skip != 'true'
        run: cargo test --workspace --locked --config 'profile.dev.package."*".opt-level=0'
      # The game also builds for the web (wasm32; no browser needed to check it compiles).
      - if: steps.tested.outputs.skip != 'true'
        run: rustup target add wasm32-unknown-unknown
      - if: steps.tested.outputs.skip != 'true'
        run: cargo clippy --locked --target wasm32-unknown-unknown -p rustpg2d-game -- -D warnings
      # Game and editor also compile for Windows (no linking; the Windows job tests them
      # natively). The editor's TLS library (ring, for Generate art) compiles C: the MinGW C
      # compiler is needed even for a check.
      - if: steps.tested.outputs.skip != 'true'
        run: rustup target add x86_64-pc-windows-gnu
      - if: steps.tested.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gcc-mingw-w64-x86-64
      - if: steps.tested.outputs.skip != 'true'
        run: cargo clippy --locked --target x86_64-pc-windows-gnu -p rustpg2d-game -p rustpg2d-editor -- -D warnings

  smoke:
    name: Runtime smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Nothing new to test: a merge into master with the pull request's tree (master only takes
      # up-to-date branches), or the back-merge master -> develop while develop has nothing master
      # lacks (the merge is master's tree, which its release / hotfix pull request tested).
      - name: Already tested?
        id: tested
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          same_tree() { git rev-parse -q --verify HEAD^2 > /dev/null && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; }
          if [ "$EVENT" = push ] && same_tree; then
            echo "the merged pull request tested this tree"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = pull_request ] && [ "$HEAD_REF" = master ] && [ "$BASE_REF" = develop ] && same_tree; then
            echo "back-merge: the result is master's tree, tested by its release / hotfix pull request"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tested.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - if: steps.tested.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: smoke
      - if: steps.tested.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev libudev-dev xvfb xauth libgl1-mesa-dri libglx-mesa0 libxi6 libxcursor1 libxkbcommon-x11-0
      # The repository's dev profile (optimized dependencies): what developers and the editor's
      # play-test run; opt-level 0 renders too slowly under llvmpipe for timed autoplay steps.
      - if: steps.tested.outputs.skip != 'true'
        run: cargo build --locked -p rustpg2d-game -p rustpg2d-editor
      - if: steps.tested.outputs.skip != 'true'
        run: cargo build --locked -p rustpg2d-editor --example mcp_smoke
      - if: steps.tested.outputs.skip != 'true'
        run: scripts/ci/smoke.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-logs
          path: ${{ runner.temp }}/rustpg2d-smoke/*.log
          retention-days: 7

  version:
    name: Version
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Release / hotfix version (SemVer, above the last tag, Cargo.toml, CHANGELOG)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: cargo xtask check-version "$HEAD_REF"

  windows:
    name: Windows
    # Native build and tests with MSVC (the downloads cross-compile with MinGW-w64 on Linux).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'master')
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked --config 'profile.dev.package."*".opt-level=0'

  macos:
    name: macOS
    # Clippy for editor and game and the engine's tests on a Mac (the release builds are in
    # builds.yml).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'master')
    runs-on: macos-latest
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
      - run: cargo clippy --locked -p rustpg2d-editor -p rustpg2d-game -- -D warnings
      # The engine's tests on macOS (paths, export, signing).
      - run: cargo test --locked -p rustpg2d-engine --lib

  builds:
    name: Release builds
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'master')
    uses: ./.github/workflows/builds.yml

  packages:
    name: Packages
    needs: builds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/packages
      # Kept for the release: the Release workflow publishes these files when this pull request
      # is merged.
      - uses: actions/upload-artifact@v7
        with:
          name: rustpg2d-packages
          path: |
            dist/*.AppImage
            dist/*.flatpak
            dist/*.zip
          retention-days: 30

  macos-app:
    name: macOS app
    needs: packages
    uses: ./.github/workflows/macos-app.yml
