# Checks for every pull request into develop / master, and pushes to master (their results on
# the merge commit satisfy the back-merge pull request into develop). The job names are the
# required status checks of the branch rulesets (AGENTS.md):
#   develop: Branch policy, Build, lint, test
#   master:  Branch policy, Build, lint, test, Version, Packages
# Version, Packages and Windows only run for pull requests into master (release / hotfix
# branches); the toolkit packages can be built from any branch with Actions > Release > Run
# workflow, and Actions > CI > Run workflow runs these checks (Windows included) on any branch.
name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  policy:
    name: Branch policy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # xtask without the dist feature has no engine dependency: compiles in seconds.
      - name: Branch may merge into its target
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: cargo xtask check-branch "$HEAD_REF" "$BASE_REF"
      - name: Pushes need no check
        if: github.event_name != 'pull_request'
        run: echo "push to ${{ github.ref_name }}"

  build:
    name: Build, lint, test
    runs-on: ubuntu-22.04
    env:
      # Local debug builds optimize dependencies (Cargo.toml) to keep the game playable; CI only
      # compiles and runs short tests, so unoptimized is much faster.
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev libudev-dev
      # No separate `cargo build`: clippy checks every target (all features, so xtask's dist
      # too) and `cargo test` compiles every crate, binaries included.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked --config 'profile.dev.package."*".opt-level=0'
      # The game and editor also compile for Windows (no linking: no cross compiler needed).
      - run: rustup target add x86_64-pc-windows-gnu
      - run: cargo clippy --locked --target x86_64-pc-windows-gnu -p rustpg2d-game -p rustpg2d-editor -- -D warnings

  version:
    name: Version
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Release / hotfix version (SemVer, above the last tag, Cargo.toml, CHANGELOG)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: cargo xtask check-version "$HEAD_REF"

  packages:
    name: Packages
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev libudev-dev
      - uses: ./.github/actions/packages
      - uses: actions/upload-artifact@v7
        with:
          name: rustpg2d-packages
          path: dist/
          retention-days: 14

  windows:
    name: Windows
    # Native build and tests with MSVC (the packages cross-compile with MinGW-w64 on Linux).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'master')
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked --config 'profile.dev.package."*".opt-level=0'
