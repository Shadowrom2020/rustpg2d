# The macOS build: universal binaries (Apple Silicon + Intel) of the editor and the game runner.
# Only a Mac can build them, so this runs on a macOS runner and hands them on as the artifact
# rustpg2d-macos-build: the Packages / Release jobs (.github/actions/packages) put the game
# runner into the Linux and Windows downloads (exports of macOS games) and assemble the macOS
# app, which macos-app.yml then signs. Called by ci.yml and release.yml.
name: macOS build

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The app and exported games say macOS 11 (the first with Apple Silicon) in their Info.plist.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  macos-build:
    name: macOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-build
      - run: cargo clippy --locked -p rustpg2d-editor -p rustpg2d-game -- -D warnings
      # The engine's tests on macOS (paths, export, signing).
      - run: cargo test --locked -p rustpg2d-engine --lib
      - name: Universal binaries
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p rustpg2d-editor -p rustpg2d-game --target "$t"
          done
          mkdir -p out
          for b in rustpg2d-editor rustpg2d-game; do
            lipo -create -output "out/$b" "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
            lipo -info "out/$b"
          done
          out/rustpg2d-game --engine-build
      - uses: actions/upload-artifact@v7
        with:
          name: rustpg2d-macos-build
          path: out/
          retention-days: 7
