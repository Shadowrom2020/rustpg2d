# The macOS game runner, a universal binary (Apple Silicon + Intel) that the Linux editor puts
# into exported macOS games (File > Export game > macOS). Only a Mac can build it, so this job
# runs on a macOS runner and hands the binary to the Packages / Release jobs as the artifact
# rustpg2d-game-macos (.github/actions/packages downloads it). Called by ci.yml and release.yml.
name: macOS game runner

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Info.plist of exported games says macOS 11 (the first with Apple Silicon).
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  macos-game:
    name: macOS game runner
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-game
      - run: cargo clippy --locked -p rustpg2d-game -- -D warnings
      # The engine's tests on macOS (paths, export, signing); the editor stays Linux-only.
      - run: cargo test --locked -p rustpg2d-engine --lib
      - name: Universal binary
        run: |
          cargo build --release --locked -p rustpg2d-game --target aarch64-apple-darwin
          cargo build --release --locked -p rustpg2d-game --target x86_64-apple-darwin
          mkdir -p out
          lipo -create -output out/rustpg2d-game-macos \
            target/aarch64-apple-darwin/release/rustpg2d-game target/x86_64-apple-darwin/release/rustpg2d-game
          lipo -info out/rustpg2d-game-macos
          out/rustpg2d-game-macos --engine-build
      - uses: actions/upload-artifact@v7
        with:
          name: rustpg2d-game-macos
          path: out/rustpg2d-game-macos
          retention-days: 7
