# A merge into master is a release (AGENTS.md): tag the merge commit vX.Y.Z (the version in
# Cargo.toml, checked by CI before the merge), publish a GitHub Release with the CHANGELOG section
# and the downloads (AppImage, Flatpak, Windows zip, macOS app), and open the pull request that
# merges master back into develop.
# The downloads are the ones CI built for the merged pull request: master only takes up-to-date
# branches, so the merge commit has exactly the tree that pull request's run built and tested.
#   version -> reuse (finds that run and its artifacts) -> publish        (about a minute)
# Only when they can't be found (expired, a merge that changed the tree, a manual run) the
# downloads are built here as in CI: builds.yml -> packages -> macos-app -> publish.
# Run by hand (Actions > Release > Run workflow, any branch) it only builds the downloads, or with
# `from_commit` (a pull request's head commit) fetches that pull request's packages, and checks
# them; tags and releases are made only by a push to master.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      from_commit:
        description: "Head commit of a pull request into master whose CI packages to fetch (try the reuse path)"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Artifacts of the pull request's CI run.
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      # Build the downloads: a new version, or a manual run.
      build: ${{ steps.v.outputs.exists == 'false' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version
        id: v
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" > /dev/null; then
            echo "v$v is already released: nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          case "$v" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  reuse:
    name: Reuse the pull request's packages
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-22.04
    outputs:
      run-id: ${{ steps.find.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Find the pull request's CI run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FROM: ${{ inputs.from_commit }}
        run: |
          if [ -n "$FROM" ]; then
            head=$FROM
          elif [ "${{ github.event_name }}" = push ] && git rev-parse -q --verify HEAD^2 > /dev/null && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
            head=$(git rev-parse HEAD^2)
          else
            echo "not a merge with its pull request's tree: building the downloads"
            exit 0
          fi
          run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success&per_page=30" \
            --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$REPO\")] | sort_by(.created_at) | last | .id // empty")
          if [ -z "$run" ]; then
            echo "no successful CI run of a pull request at $head: building the downloads"
            exit 0
          fi
          names=" $(gh api "repos/$REPO/actions/runs/$run/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired | not) | .name] | join(" ")') "
          for a in rustpg2d-packages rustpg2d-macos-app; do
            case "$names" in
              *" $a "*) ;;
              *) echo "CI run $run has no $a (expired?): building the downloads"; exit 0 ;;
            esac
          done
          echo "the downloads of CI run $run (pull request head $head)"
          echo "run_id=$run" >> "$GITHUB_OUTPUT"

  # Fallback: build the downloads here (as CI does for pull requests into master).
  builds:
    needs: [version, reuse]
    if: ${{ !cancelled() && needs.version.outputs.build == 'true' && needs.reuse.outputs.run-id == '' }}
    uses: ./.github/workflows/builds.yml

  packages:
    name: Packages
    needs: builds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/packages
      - uses: actions/upload-artifact@v7
        with:
          name: rustpg2d-packages
          path: |
            dist/*.AppImage
            dist/*.flatpak
            dist/*.zip
          retention-days: 7

  macos-app:
    needs: packages
    uses: ./.github/workflows/macos-app.yml

  publish:
    name: Publish
    needs: [version, reuse, packages, macos-app]
    if: ${{ !cancelled() && needs.version.outputs.build == 'true' && (needs.reuse.outputs.run-id != '' || needs.macos-app.result == 'success') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      # From the pull request's CI run, else from the builds of this run.
      - uses: actions/download-artifact@v8
        with:
          pattern: "{rustpg2d-packages,rustpg2d-macos-app}"
          merge-multiple: true
          path: dist
          run-id: ${{ needs.reuse.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: The downloads are this version
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          n=0
          for f in dist/*.AppImage dist/*.flatpak dist/*-windows-x86_64.zip dist/*-macos.zip; do
            case "$(basename "$f")" in
              rustpg2d-"$V"[.-]*) n=$((n + 1)) ;;
              *) echo "::error::$f is not a download of version $V"; exit 1 ;;
            esac
          done
          test "$n" -eq 4 || { echo "::error::expected 4 downloads, found $n"; exit 1; }
          (cd dist && sha256sum -- *.AppImage *.flatpak *.zip > SHA256SUMS && cat SHA256SUMS)
      - name: Tag and GitHub Release
        if: github.event_name == 'push' && needs.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
          PRE: ${{ needs.version.outputs.prerelease }}
        run: |
          cargo xtask release-notes "$V" > "$RUNNER_TEMP/notes.md"
          git tag "v$V" "$GITHUB_SHA"
          git push origin "v$V"
          flags=()
          if [ "$PRE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "v$V" dist/*.AppImage dist/*.flatpak dist/*-windows-x86_64.zip dist/*-macos.zip dist/SHA256SUMS \
            --title "R(ust)PG2D $V" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag "${flags[@]}"
      - name: Back-merge pull request (master into develop)
        if: github.event_name == 'push' && needs.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          git fetch -q origin develop
          if [ "$(git rev-list --count origin/develop..HEAD)" -eq 0 ]; then
            echo "develop already contains this release"
          elif [ -n "$(gh pr list --base develop --head master --state open --json number --jq '.[].number')" ]; then
            echo "a back-merge pull request is already open"
          else
            gh pr create --base develop --head master --title "Merge v$V back into develop" \
              --body "Brings the version bump and the release / hotfix changes of v$V back into develop (AGENTS.md: finishing a release). Merge with a merge commit."
          fi
