[workspace]
resolver = "2"
members = ["crates/gfx", "crates/engine", "crates/game", "crates/editor-core", "crates/studio", "crates/packaging", "crates/xtask"]
# The 0.35 editor (macroquad + egui 0.31): kept to read while the new one is built (ROADMAP.md,
# 0.36.0), no longer compiled.
exclude = ["crates/editor"]

[workspace.package]
version = "0.35.0-alpha.1"
edition = "2021"
license = "MIT"
# The toolchain CI and rust-toolchain.toml use; the code relies on APIs of this version.
rust-version = "1.99"

[workspace.dependencies]
rustpg2d-engine = { path = "crates/engine" }
gfx = { package = "rustpg2d-gfx", path = "crates/gfx" }
editor-core = { package = "rustpg2d-editor-core", path = "crates/editor-core" }
rustpg2d-packaging = { path = "crates/packaging" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
postcard = { version = "1", features = ["use-std"] }
lz4_flex = "0.14"
rhai = "1.27"
anyhow = "1"

# Keep debug builds playable: optimize dependencies, not our own crates.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Release binaries (the downloads, exported games): whole-program optimization across crates and
# no symbol table. Not `panic = "abort"`: audio.rs catches a panic of the sound device.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
