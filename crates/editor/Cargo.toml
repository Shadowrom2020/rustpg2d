[package]
name = "rustpg2d-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rustpg2d-engine.workspace = true
macroquad.workspace = true
egui-macroquad.workspace = true
egui-phosphor = "0.9"
anyhow.workspace = true
ron.workspace = true
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# File › Import…: Tiled maps (.tmx XML, .tmj / Aseprite JSON through rhai), compressed tile data.
quick-xml = "0.41"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rhai.workspace = true
# AppImage / Flatpak exports (package.rs).
rustpg2d-packaging.workspace = true
# AI agent server (Assets › AI agent server…, mcp/): the Model Context Protocol over Streamable HTTP
# on 127.0.0.1, served by a tokio thread; tool parameters and project data as JSON.
rmcp = { version = "3", features = ["transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros", "process", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde.workspace = true
serde_json = "1"
schemars = "1"

[dev-dependencies]
# examples/mcp_smoke.rs: an MCP client driving the editor's agent server.
rmcp = { version = "3", features = ["client", "transport-streamable-http-client-reqwest"] }
