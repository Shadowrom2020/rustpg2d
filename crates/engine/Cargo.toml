[package]
name = "rustpg2d-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# JSON Schemas of the definition types (the editor's forms are made from them).
schema = ["dep:schemars", "dep:serde_json"]

[dependencies]
gfx.workspace = true
serde.workspace = true
ron.workspace = true
postcard.workspace = true
lz4_flex.workspace = true
anyhow.workspace = true
png = "0.18"
# Portable math functions (glibc_compat.rs).
libm = "0.2"
# Decodes music (Ogg Vorbis) to make its loops gapless (audio.rs).
lewton = "0.9"
# 3D character models (model.rs): glTF binary files from Meshy, Blender and other tools.
gltf = { version = "1", default-features = false, features = ["utils", "names"] }
# Which characters a project font has glyphs for (fonts.rs).
ttf-parser = { version = "0.25", default-features = false, features = ["no-std-float"] }
# The shapes of definitions for the editor's forms (schema.rs), only with the feature `schema`.
schemars = { version = "1", optional = true, features = ["preserve_order"] }
serde_json = { version = "1", optional = true, features = ["preserve_order"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rhai.workspace = true
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Gamepads (the platform layer reads keyboard, mouse and touch); needs libudev on Linux.
gilrs = "0.11"

# The web game (wasm32-unknown-unknown, loaded by macroquad's JS, no wasm-bindgen): Rhai without
# its random hash seeds (getrandom) and clock (web-time), which need wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rhai = { version = "1.27", default-features = false, features = ["std", "no_time"] }

[[example]]
name = "schema"
required-features = ["schema"]

[dev-dependencies]
# The script API table's return types are checked against Rhai's own signatures (tests only).
rhai = { workspace = true, features = ["metadata"] }
