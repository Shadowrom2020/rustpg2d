<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  noscript { color: #ddd; font: 16px sans-serif; position: absolute; top: 40%; width: 100%; text-align: center; }
</style>
</head>
<body>
<!-- Right-click is a game input (walk there, interact): no browser context menu over the game. -->
<canvas id="glcanvas" tabindex="1" oncontextmenu="return false"></canvas>
<noscript>{title} needs JavaScript and WebGL.</noscript>
<!-- Made with R(ust)PG2D (MIT): https://github.com/Shadowrom2020/rustpg2d -->
<!-- (macroquad's bundle assigns this global in strict mode; declared so its unused network plugin doesn't throw.) -->
<script>var register_plugin;</script>
<script src="mq_js_bundle.js"></script>
<script src="rustpg2d.js"></script>
<script>
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  load("rustpg2d-game.wasm");
  document.getElementById("glcanvas").focus();
</script>
</body>
</html>
