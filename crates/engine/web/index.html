<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  noscript, #failed { color: #ddd; font: 16px sans-serif; position: absolute; top: 40%; width: 100%; text-align: center; }
</style>
</head>
<body>
<!-- Right-click is a game input (walk there, interact): no browser context menu over the game. -->
<canvas id="glcanvas" tabindex="1" oncontextmenu="return false"></canvas>
<noscript>{title} needs JavaScript and WebGL 2.</noscript>
<!-- Made with R(ust)PG2D (MIT): https://github.com/Shadowrom2020/rustpg2d -->
<script type="module">
  import init from "./rustpg2d-game.js";
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.getElementById("glcanvas").focus();
  init({ module_or_path: "rustpg2d-game.wasm" }).catch(function (e) {
    // (The game's loop leaves the start function by an exception of this name: not a failure.)
    if (String(e && e.message).indexOf("Using exceptions for control flow") >= 0) { return; }
    console.error(e);
    const p = document.createElement("p");
    p.id = "failed";
    p.textContent = "{title} could not start: " + e;
    document.body.appendChild(p);
  });
</script>
</body>
</html>
