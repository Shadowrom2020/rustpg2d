[package]
name = "rustpg2d-gfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "R(ust)PG2D's platform layer: window, drawing (wgpu), text, input. Its drawing API keeps the names of macroquad, which the engine was written against."

[dependencies]
# The same wgpu as egui-wgpu / eframe 0.37 uses: the editor hands its device to this crate.
wgpu = "30"
glam = { version = "0.30", features = ["scalar-math", "bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
# Text: the rasteriser macroquad used, so glyphs keep their pixels.
fontdue = "0.9"
# Pictures: PNG and JPEG (model textures) decoding.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# The small generator macroquad's `rand` was: the same numbers for the same seed.
quad-rand = "0.2"

# Sound: the mixer, with WAV and Ogg Vorbis decoding (not its default features: the realtime
# thread priority wants D-Bus).
kira = { version = "0.12", default-features = false, features = ["cpal", "ogg", "vorbis", "wav", "pcm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"
pollster = "0.4"
