[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# `dist` (packaging the toolkit) needs the engine; the checks CI runs on every pull request don't.
dist = ["dep:rustpg2d-engine", "dep:rustpg2d-packaging"]

[dependencies]
anyhow.workspace = true
rustpg2d-engine = { workspace = true, optional = true }
rustpg2d-packaging = { workspace = true, optional = true }
